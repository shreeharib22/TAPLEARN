<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TAPLEARN — Living Grove</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#4a4d44; }
    body { position:relative; }
    canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
    .scene-grain {
      position:absolute; inset:0; pointer-events:none; opacity:.11; mix-blend-mode:soft-light;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E");
    }
    @media (prefers-reduced-motion: reduce) { canvas { opacity:.92; } }
  </style>
</head>
<body>
  <canvas id="grove" aria-label="An original animated tree and root scene"></canvas>
  <div class="scene-grain"></div>
  <script src="/landing-pages/inner-green-assets/three.min.js"></script>
  <script>
    (() => {
      const canvas = document.getElementById('grove');
      if (!window.THREE || !canvas) return;

      const THREE = window.THREE;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x4a4d44);
      scene.fog = new THREE.FogExp2(0x4a4d44, 0.045);

      const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 70);
      camera.position.set(0.25, 2.3, 10.6);
      camera.lookAt(0.45, 2.0, 0);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'low-power' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
      renderer.setClearColor(0x4a4d44, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;

      scene.add(new THREE.HemisphereLight(0xe8eadb, 0x252c22, 2.0));
      const key = new THREE.DirectionalLight(0xf2e7ce, 2.7);
      key.position.set(-3.5, 7, 5);
      scene.add(key);
      const rim = new THREE.PointLight(0xc0cfa6, 22, 15, 2);
      rim.position.set(3.8, 4.3, -2.4);
      scene.add(rim);

      const grove = new THREE.Group();
      grove.position.set(1.75, -0.65, -0.4);
      scene.add(grove);

      const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x373d30, roughness: 0.92, metalness: 0.02 });
      const rootMaterial = new THREE.MeshStandardMaterial({ color: 0x4b5540, roughness: 0.95 });
      const branchMaterial = new THREE.MeshStandardMaterial({ color: 0x59664d, roughness: 0.88 });

      function branch(points, radius, material, parent = grove) {
        const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
        const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 34, radius, 7, false), material);
        parent.add(mesh);
        return mesh;
      }

      // A hand-authored tree form: curved trunk, visible roots and asymmetric boughs.
      branch([[0,-0.55,0],[0.08,0.35,0.05],[-0.08,1.25,0],[0.06,2.15,-0.02],[0.0,3.1,-0.05],[0.28,4.05,-0.12]], 0.115, trunkMaterial);
      branch([[0.02,-0.45,0],[0.0,-0.12,0.12],[-0.45,-0.35,0.24],[-0.94,-0.58,0.36],[-1.28,-0.63,0.48]], 0.055, rootMaterial);
      branch([[0.04,-0.42,0],[0.05,-0.12,-0.12],[0.56,-0.35,-0.3],[1.04,-0.55,-0.42],[1.42,-0.61,-0.47]], 0.052, rootMaterial);
      branch([[0.06,0.55,0],[0.6,1.0,0.05],[1.1,1.7,0.02],[1.72,2.03,-0.02],[2.15,2.42,-0.08]], 0.062, branchMaterial);
      branch([[-0.04,1.42,0],[-0.62,1.72,0.04],[-1.2,2.2,0.08],[-1.82,2.43,0.02],[-2.22,2.78,-0.04]], 0.06, branchMaterial);
      branch([[0.0,2.12,-0.02],[0.55,2.5,-0.08],[0.88,3.05,-0.13],[1.38,3.46,-0.2]], 0.045, branchMaterial);
      branch([[0.02,2.55,0],[-0.52,2.9,-0.06],[-0.88,3.45,-0.12],[-1.38,3.72,-0.18]], 0.044, branchMaterial);
      branch([[0.06,3.0,-0.04],[0.02,3.46,-0.1],[-0.32,3.95,-0.15],[-0.54,4.25,-0.2]], 0.035, branchMaterial);
      branch([[0.1,3.55,-0.1],[0.62,3.92,-0.17],[0.94,4.25,-0.22]], 0.032, branchMaterial);

      // Soft canopy made from instanced leaf forms to keep the scene light enough for laptops.
      const leafGeometry = new THREE.SphereGeometry(1, 7, 5);
      const leafMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.82, metalness: 0.0 });
      const leafCount = 560;
      const leaves = new THREE.InstancedMesh(leafGeometry, leafMaterial, leafCount);
      const dummy = new THREE.Object3D();
      const palette = [0x839276, 0x9aa58a, 0x687b5d, 0xb0b69a, 0x75866a, 0xc1b18d];
      for (let i = 0; i < leafCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 0.35 + Math.random() * 2.25;
        const y = 2.7 + (Math.random() - 0.12) * 2.15;
        const x = Math.cos(angle) * radius * 0.95;
        const z = Math.sin(angle) * radius * 0.55;
        dummy.position.set(x, y, z);
        dummy.rotation.set(Math.random() * 1.2, angle, Math.random() * Math.PI);
        const scale = 0.055 + Math.random() * 0.095;
        dummy.scale.set(scale * 0.7, scale * 0.24, scale * 1.8);
        dummy.updateMatrix();
        leaves.setMatrixAt(i, dummy.matrix);
        leaves.setColorAt(i, new THREE.Color(palette[Math.floor(Math.random() * palette.length)]));
      }
      leaves.instanceMatrix.needsUpdate = true;
      grove.add(leaves);

      // Low, quiet ground and a few moss mounds anchor the roots.
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(6.2, 64),
        new THREE.MeshStandardMaterial({ color: 0x59614f, roughness: 1, transparent: true, opacity: 0.58 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.set(0.2, -0.66, -0.1);
      grove.add(ground);

      const moteCount = 140;
      const motePositions = new Float32Array(moteCount * 3);
      for (let i = 0; i < moteCount; i++) {
        motePositions[i*3] = (Math.random() - 0.5) * 10;
        motePositions[i*3+1] = Math.random() * 6.5 - 0.5;
        motePositions[i*3+2] = (Math.random() - 0.5) * 5 - 1.5;
      }
      const moteGeometry = new THREE.BufferGeometry();
      moteGeometry.setAttribute('position', new THREE.BufferAttribute(motePositions, 3));
      const motes = new THREE.Points(moteGeometry, new THREE.PointsMaterial({ color: 0xe2d4b8, size: 0.035, transparent: true, opacity: 0.58, depthWrite: false }));
      scene.add(motes);

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let pointerX = 0;
      let pointerY = 0;
      let frame = 0;
      function resize() {
        const width = Math.max(1, window.innerWidth);
        const height = Math.max(1, window.innerHeight);
        camera.aspect = width / height;
        camera.fov = width < 700 ? 50 : 42;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }
      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('pointermove', event => {
        pointerX = (event.clientX / Math.max(1, window.innerWidth) - 0.5) * 0.12;
        pointerY = (event.clientY / Math.max(1, window.innerHeight) - 0.5) * 0.08;
      }, { passive: true });
      resize();

      function animate() {
        frame = requestAnimationFrame(animate);
        const t = performance.now() * 0.00025;
        if (!reducedMotion) {
          grove.rotation.y = Math.sin(t) * 0.035 + pointerX * 0.45;
          grove.rotation.z = Math.sin(t * 0.7) * 0.012 - pointerY * 0.2;
          leaves.rotation.y = Math.sin(t * 0.8) * 0.018;
          motes.rotation.y = t * 0.035;
        }
        renderer.render(scene, camera);
      }
      animate();
      window.addEventListener('pagehide', () => {
        cancelAnimationFrame(frame);
        renderer.dispose();
        leafGeometry.dispose();
        leafMaterial.dispose();
        moteGeometry.dispose();
      }, { once: true });
    })();
  </script>
</body>
</html>
